name: Observatorio Democrático — Pipeline de Scraping

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo a ejecutar (1-7 o "todos")'
        required: false
        default: 'todos'
      test_mode:
        description: 'Modo prueba (true/false)'
        required: false
        default: 'false'
      modo_completo:
        description: 'Grupos 1-5: recorrer el listado completo (no cortar al llegar a lo ya cargado) para traer lo atrasado (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'
  DISPLAY: ':99'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # GRUPO 1 — Scrapers rápidos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_1_rapidos:
    name: 'Grupo 1 — Rápidos'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '1'
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          SCRAPER_MODO_COMPLETO: ${{ github.event.inputs.modo_completo == 'true' && '1' || '' }}
          SCRAPER_MAX_MINUTOS: '45'
        run: |
          python pipeline_runner.py \
            --only presidencia sinartdigital monumental telediario \
                   pulsocr theglobalcr ticosland caribeactual \
                   puntarenasseoye \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-1
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 2 — Scrapers medianos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_2_medianos:
    name: 'Grupo 2 — Medianos'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '2'
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          SCRAPER_MODO_COMPLETO: ${{ github.event.inputs.modo_completo == 'true' && '1' || '' }}
          SCRAPER_MAX_MINUTOS: '90'
        run: |
          python pipeline_runner.py \
            --only ticotimes latejacr vozdeguanacaste \
            --workers 6 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-2
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 3 — Scrapers lentos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_3_lentos:
    name: 'Grupo 3 — Lentos'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '3'
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          SCRAPER_MODO_COMPLETO: ${{ github.event.inputs.modo_completo == 'true' && '1' || '' }}
          SCRAPER_MAX_MINUTOS: '120'
        run: |
          python pipeline_runner.py \
            --only lareaccioncr noticiasenlineacr puroperiodismo larevistacr \
                   lavozdegoicoechea \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-3
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 4 — Scrapers muy lentos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_4_muy_lentos:
    name: 'Grupo 4 — Muy lentos'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '4'
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          SCRAPER_MODO_COMPLETO: ${{ github.event.inputs.modo_completo == 'true' && '1' || '' }}
          SCRAPER_MAX_MINUTOS: '150'
        run: |
          python pipeline_runner.py \
            --only teletica repretel genteopa \
            --workers 3 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-4
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 5 — WordPress + Legacy sin Playwright
  # ─────────────────────────────────────────────────────────────────
  grupo_5_wordpress:
    name: 'Grupo 5 — WordPress + Legacy'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '5'
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          SCRAPER_MODO_COMPLETO: ${{ github.event.inputs.modo_completo == 'true' && '1' || '' }}
          # Diario: 8 min por sitio (el adaptador lo corta a los 10). En modo completo (recuperar atrasado
          # de un sitio nuevo, p. ej. periodicomensaje) 45 min; el adaptador ajusta su límite a este valor.
          SCRAPER_MAX_MINUTOS: ${{ github.event.inputs.modo_completo == 'true' && '45' || '8' }}
        run: |
          python pipeline_runner.py \
            --only adiariocr alajuelitasoy buzonderodrigo guanacastealaaltura \
                   miprensacr radiolapampa radiopuertotv tvsur \
                   ustedseinforma elcolectivo506 elmundocr el_jilguero \
                   elmonitorcr periodicomensaje \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-5
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 6 — Legacy Colab parte 1  (sin Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_6_legacy_colab_1:
    name: 'Grupo 6 — Legacy Colab (1/2)'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '6'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only alajuela_digital amprensa crc_89_1 crhoy \
                   diarioextra digital506 el_jornal el_observador \
                   el_sol_de_occidente \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-6
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 7 — Legacy Colab parte 2  (sin Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_7_legacy_colab_2:
    name: 'Grupo 7 — Legacy Colab (2/2)'
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '7'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only el_financiero eldelfino elnortehoy lanacion \
                   larepublica noticias_la_garita_costa_rica periodico_mi_tierra sancarlosdigital \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-7
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # CONSOLIDAR — Une todos los CSVs y actualiza el corpus maestro
  # ─────────────────────────────────────────────────────────────────
  consolidar_corpus:
    name: 'Consolidar corpus maestro'
    runs-on: ubuntu-24.04
    needs:
      - grupo_1_rapidos
      - grupo_2_medianos
      - grupo_3_lentos
      - grupo_4_muy_lentos
      - grupo_5_wordpress
      - grupo_6_legacy_colab_1
      - grupo_7_legacy_colab_2
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Restaurar corpus previo (cache)
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: |
            corpus/
            contingencia/
          key: corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: corpus-${{ runner.os }}-

      - name: Descargar outputs de todos los grupos
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Mover CSVs a output/
        run: |
          mkdir -p output/
          find artifacts/ -name "*.csv" ! -name "*discarded*" ! -name "*backup*" -exec cp {} output/ \;
          echo "CSVs disponibles: $(ls output/*.csv 2>/dev/null | wc -l)"
          ls output/*.csv 2>/dev/null || echo "Sin CSVs"

      - name: Construir o actualizar corpus
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          mkdir -p corpus/ contingencia/
          if compgen -G "corpus/corpus_observatorio_v*.csv" > /dev/null; then
            echo "Corpus previo encontrado — ejecutando actualizador incremental"
            python corpus_updater.py \
              --output output/ \
              --corpus corpus/
          else
            echo "Sin corpus previo — construyendo corpus desde cero"
            python corpus_builder.py \
              --output output/ \
              --corpus corpus/
          fi

      # SCRUM-28: lo que esta corrida dejó en el corpus CSV debe estar también en PostgreSQL.
      # Una desviación deja el job en rojo (ver el último paso); el detalle va al resumen del run.
      - name: Verificar escritura dual CSV + PostgreSQL
        id: verif
        continue-on-error: true
        env:
          N8N_URLS_CONOCIDAS_URL: ${{ secrets.N8N_URLS_CONOCIDAS_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: python verificar_escritura_dual.py --output output/ --corpus corpus/ --salida logs/

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-maestro
          path: corpus/
          retention-days: 30

      - name: Limpiar CSVs individuales de output/
        run: |
          csv_count=$(ls output/*.csv 2>/dev/null | wc -l)
          rm -f output/*.csv
          echo "CSVs eliminados: $csv_count (datos ya consolidados en corpus/)"

      - name: Consolidar reportes de ejecución
        if: always()
        run: |
          mkdir -p logs/
          find artifacts/ -name "pipeline_report_*.json" -exec cp {} logs/ \;
          echo "Reportes consolidados: $(ls logs/pipeline_report_*.json 2>/dev/null | wc -l)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ejecucion
          path: logs/
          retention-days: 7

      - name: Fallar si la escritura dual se desvió
        if: steps.verif.outcome == 'failure'
        run: |
          echo "::error::Desviación entre el corpus CSV y PostgreSQL: ver el resumen de este run"
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # LIMPIEZA — Elimina workflow runs con más de 7 días
  # ─────────────────────────────────────────────────────────────────
  limpiar_runs_antiguos:
    name: 'Limpiar runs antiguos (>7 días)'
    runs-on: ubuntu-24.04
    needs: consolidar_corpus
    if: always()
    permissions:
      actions: write

    steps:
      - name: Eliminar workflow runs con más de 7 días
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -d '7 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          echo "Eliminando runs anteriores a: $cutoff"

          deleted=0
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --json databaseId,createdAt,status \
            | jq -r --arg cutoff "$cutoff" \
                '.[] | select(.createdAt < $cutoff and .status != "in_progress") | .databaseId' \
            | while read run_id; do
                if gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
                  echo "  ✓ Eliminado run $run_id"
                  deleted=$((deleted + 1))
                fi
              done
          echo "Limpieza completada"
